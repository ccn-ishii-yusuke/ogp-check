<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OGP test - summary / 1000x1000</title>
<meta name="description" content="Twitter Card summary + 1000x1000 OGP image">
<meta name="robots" content="noindex">

<meta property="og:type" content="website">
<meta property="og:url" content="https://ccn-ishii-yusuke.github.io/ogp-check/summary-1000.html">
<meta property="og:title" content="OGP test - summary / 1000x1000">
<meta property="og:description" content="Twitter Card summary + 1000x1000 OGP image">
<meta property="og:image" content="https://ccn-ishii-yusuke.github.io/ogp-check/1000x1000.png">
<meta property="og:image:width" content="1000">
<meta property="og:image:height" content="1000">
<meta property="og:site_name" content="ogp-check">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="OGP test - summary / 1000x1000">
<meta name="twitter:description" content="Twitter Card summary + 1000x1000 OGP image">
<meta name="twitter:image" content="https://ccn-ishii-yusuke.github.io/ogp-check/1000x1000.png">

<style>
.share { display: flex; gap: .5em; margin: 1em 0; flex-wrap: wrap; }
.share a { display: inline-block; padding: .4em .9em; border-radius: 4px; text-decoration: none; color: #fff; font-size: .9em; }
.share .x { background: #000; }
.share .fb { background: #1877f2; }
.share .line { background: #06c755; }
</style>
</head>
<body>
<h1>OGP test - summary / 1000x1000</h1>
<p>twitter:card = <code>summary</code></p>
<p>og:image = <code>1000x1000.png</code> (1000 x 1000)</p>
<p><img src="1000x1000.png" alt="1000x1000 preview" width="300"></p>

<h2>Share</h2>
<div class="share" id="share"></div>

<p><a href="index.html">&larr; index</a></p>

<script>
(function () {
  var url = document.querySelector('meta[property="og:url"]').content;
  var text = document.title;
  var enc = encodeURIComponent;
  var links = [
    ['x',    'X でシェア', 'https://twitter.com/intent/tweet?text=' + enc(text) + '&url=' + enc(url)],
    ['fb',   'Facebook',   'https://www.facebook.com/sharer/sharer.php?u=' + enc(url)],
    ['line', 'LINE',       'https://social-plugins.line.me/lineit/share?url=' + enc(url)]
  ];
  document.getElementById('share').innerHTML = links.map(function (l) {
    return '<a class="' + l[0] + '" href="' + l[2] + '" target="_blank" rel="noopener">' + l[1] + '</a>';
  }).join('');
})();
</script>
</body>
</html>
